openapi: 3.0.0
info:
  title: KosmetikOn API
  description: API for managing cosmetic Raw Materials
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Local development server
paths:
  /raw-materials:
    get:
      summary: Get all raw materials
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of raw materials
    post:
      summary: Create a raw material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawMaterialInput'
      responses:
        '201':
          description: Created
        '400':
          description: Validation error
        '409':
          description: Duplicate code or name
  /raw-materials/{id}:
    get:
      summary: Get a raw material by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Raw material object
        '404':
          description: Not found
    put:
      summary: Update a raw material
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawMaterialInput'
      responses:
        '200':
          description: Updated raw material
        '404':
          description: Not found
        '409':
          description: Duplicate code or name
    delete:
      summary: Delete a raw material
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted successfully
        '404':
          description: Not found

components:
  schemas:
    RawMaterialInput:
      type: object
      required:
        - name
        - code
        - category
        - unit_of_measure
        - quantity
        - status
      properties:
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 50
        category:
          type: string
          maxLength: 80
        unit_of_measure:
          type: string
          maxLength: 20
        quantity:
          type: number
          minimum: 0
        status:
          type: string
          enum: [active, inactive]
        description:
          type: string
